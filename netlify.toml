# Netlify 프런트엔드 데모 (https://jobpick.netlify.app)
#  - Mock 데이터/인증으로 동작하는 정적 데모 (--mode demo)
#  - 배포는 GitHub Actions(.github/workflows/deploy.yml)가 frontend 변경 시에만 수행합니다.
#    Netlify Git 연동을 사용할 경우에도 아래 ignore 규칙으로 frontend 변경이 없으면 빌드를 건너뜁니다.
[build]
  base = "frontend"
  command = "npm ci && npm run build:demo"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../rpa/data/"

[build.environment]
  NODE_VERSION = "22"
  VITE_USE_MOCK = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
