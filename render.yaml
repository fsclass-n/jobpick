# Render Blueprint
#  - jobpick-api : FastAPI 백엔드 (https://jobpick-api.onrender.com)
#  - jobpick     : React 정적 프런트엔드 (https://jobpick.onrender.com)
# 자동 배포는 끄고(autoDeploy: false), GitHub Actions 가 영역별 변경 시 Deploy Hook 으로 배포합니다.
# sync: false 항목은 Render 대시보드 Environment 에서 직접 값을 입력합니다.
services:
  - type: web
    name: jobpick-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://jobpick.onrender.com,https://jobpick.netlify.app
      - key: FRONTEND_URL
        value: https://jobpick.onrender.com
      - key: BACKEND_URL
        value: https://jobpick-api.onrender.com
      - key: SEED_ON_STARTUP
        value: "true"
      - key: SEED_DEMO_HISTORY
        value: "true"
      - key: ENABLE_TEST_ACCOUNTS
        value: "true"
      - key: USER_JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: WORKNET_API_KEY
        sync: false

  - type: web
    name: jobpick
    runtime: static
    branch: main
    autoDeploy: false
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: https://jobpick-api.onrender.com
      - key: VITE_USE_MOCK
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
